name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://crm_user:crm_password@localhost:5432/crm_agenti?schema=public"
      JWT_SECRET: "ci-pipeline-temporary-secret-for-typecheck-min-32-chars"
      PORT: "3001"
      NEXT_PUBLIC_API_URL: "http://localhost:3001"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck & Lint (all packages)
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Monorepo (Production build check)
        run: npm run build
